<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      .glow-blob {
        animation: floatBlob 8s ease-in-out infinite alternate;
      }
      .glow-blob-2 {
        animation: floatBlob2 10s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: pulsePill 4s ease-in-out infinite;
      }
      .slide-card {
        animation: slideCard 6s ease-in-out infinite alternate;
      }
      @keyframes floatBlob {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(40px, 20px) scale(1.15); }
      }
      @keyframes floatBlob2 {
        0% { transform: translate(0px, 0px) scale(1.1); }
        100% { transform: translate(-30px, -25px) scale(0.95); }
      }
      @keyframes pulsePill {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes slideCard {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="340" fill="url(#grid)" rx="16" />

  <!-- Animated Ambient Glow Blobs in Background (strictly behind text) -->
  <g opacity="0.45">
    <circle class="glow-blob" cx="220" cy="90" r="130" fill="#0284c7" filter="blur(60px)" />
    <circle class="glow-blob-2" cx="1020" cy="240" r="140" fill="#7c3aed" filter="blur(70px)" />
    <circle class="glow-blob" cx="600" cy="300" r="110" fill="#ec4899" filter="blur(75px)" />
  </g>

  <!-- Decorative Modern CSS Framework Elements on Outer Wings -->
  <!-- Left Side Badges / Floats -->
  <g opacity="0.8" class="slide-card">
    <rect x="50" y="55" width="130" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="115" y="77" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Utility-First</text>

    <rect x="70" y="105" width="120" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
    <text x="130" y="127" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎨 UI Kits</text>

    <rect x="45" y="245" width="145" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
    <text x="117" y="267" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📦 Zero-Runtime</text>
  </g>

  <!-- Right Side Preview Card / Mock Elements -->
  <g opacity="0.8" class="slide-card">
    <rect x="1010" y="60" width="140" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
    <text x="1080" y="82" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✨ Design Systems</text>

    <rect x="990" y="115" width="155" height="34" rx="17" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" />
    <text x="1067" y="137" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Production Ready</text>

    <rect x="1025" y="245" width="125" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="1087" y="267" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📱 Mobile-First</text>
  </g>

  <!-- Central Foreground Content - High Contrast, Clear, Unobstructed -->
  <!-- Top Badge / Pill -->
  <g class="pulse-pill">
    <rect x="485" y="45" width="230" height="32" rx="16" fill="#1e293b" stroke="url(#primary-grad)" stroke-width="1.5" />
    <circle cx="503" cy="61" r="5" fill="#38bdf8" />
    <text x="606" y="66" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5" text-anchor="middle">THE DEFINITIVE CSS INDEX</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="150" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" text-anchor="middle">
    Awesome CSS Frameworks
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" text-anchor="middle">
    Curated Ecosystem of Modern CSS Frameworks, UI Libraries &amp; Design Systems
  </text>

  <!-- Secondary Tagline -->
  <text x="600" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" text-anchor="middle">
    Comparing Commercial SaaS Solutions &amp; Open-Source Repositories with Real-Time Metrics &amp; Market Dynamics
  </text>

  <!-- Clean Bottom Accent Line -->
  <rect x="420" y="275" width="360" height="3" rx="1.5" fill="url(#primary-grad)" />
</svg>
